# Makes a batch of YouTube Shorts from the recorded reading (list: recorder/shorts/<batch>.json).
# Run from the Actions tab: "Make YouTube Shorts" -> "Run workflow". About 20 minutes. Results: Releases -> shorts-<batch>.
name: Make YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Which list of Shorts (a file in recorder/shorts/)"
        default: "december"
        required: true
      only:
        description: "Leave empty for the whole batch. Or a test: ids separated by commas"
        default: ""

permissions:
  contents: write

jobs:
  shorts:
    name: Shorts batch ${{ inputs.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: recorder/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r recorder/requirements.txt pillow
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download the voice model (once)
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -fsSL --retry 5 -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fsSL --retry 5 -o models/voices-v1.0.bin $base/voices-v1.0.bin
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  models/kokoro-v1.0.onnx" | sha256sum -c
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  models/voices-v1.0.bin" | sha256sum -c
      - name: Get the recordings of the books this batch uses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rec
          for BB in $(python -c "import json; print(' '.join(sorted({f'{s[\"ref\"][0]:02d}' for s in json.load(open('recorder/shorts/${{ inputs.batch }}.json'))['shorts']})))"); do
            gh release download kjv-onyx-1 -p "kjv-onyx-1-book-$BB.zip" -D dl
            unzip -q -o dl/kjv-onyx-1-book-$BB.zip -d rec
          done
          ls rec | head
      - name: Make the Shorts
        run: python recorder/make_short.py --batch recorder/shorts/${{ inputs.batch }}.json --dir rec --out shorts --only "${{ inputs.only }}"
      - name: Publish as a release (downloads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd shorts && zip -q -0 ../shorts-${{ inputs.batch }}.zip *.mp4 shorts.json)
          TAG="shorts-${{ inputs.batch }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "YouTube Shorts: ${{ inputs.batch }}" --notes "All the Shorts in one zip, named by publish date. Titles and descriptions: the Shorts upload desk."
          gh release upload "$TAG" shorts-${{ inputs.batch }}.zip --clobber
          echo "Downloads ready: Releases -> $TAG" >> "$GITHUB_STEP_SUMMARY"
